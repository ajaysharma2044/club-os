name: CEC workspace
on:
  pull_request:
    paths: ['web/**', 'services/quant/**', '.github/workflows/cec.yml']
  push:
    paths: ['web/**', 'services/quant/**', '.github/workflows/cec.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
        working-directory: web
      - run: npx tsc --noEmit
        working-directory: web
      - run: node scripts/cec-test-server.mjs
        working-directory: web
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - run: npm run build
        working-directory: web
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - run: python -m unittest discover -s tests -v
        working-directory: services/quant
