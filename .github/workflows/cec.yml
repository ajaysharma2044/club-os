name: CEC workspace
on:
  pull_request:
    paths: ['web/**', 'services/quant/**', 'scripts/**', 'Dockerfile', 'compose.production.yaml', 'deploy/**', '.nvmrc', '.github/workflows/cec.yml']
  push:
    paths: ['web/**', 'services/quant/**', 'scripts/**', 'Dockerfile', 'compose.production.yaml', 'deploy/**', '.nvmrc', '.github/workflows/cec.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
        working-directory: web
      - name: Verify types, domain, Python, API, signals and build
        run: npm --prefix web run check
      - name: Keep verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification
          path: work/verification/
          retention-days: 7

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build and check persistent container runtime
        run: bash scripts/production-smoke.sh
