# Operational routes require CEC_STORAGE=postgres, DATABASE_URL and verified TLS
# configuration (DATABASE_SSL_CA_PEM). Apply migrations before deploying.
# SQLite remains intentionally blocked on ephemeral serverless storage.
# Python analytics requires a separate durable worker; see docs/33-postgres-migration.md.

[build]
  # Every other path in this block is relative to `base`, so `publish` is
  # ".next" and NOT "web/.next" — the latter resolved to web/web/.next and
  # failed the build with "publish directory not found".
  base = "web"
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  # Public enum values occur throughout source; these are not credentials.
  # Keep scanning enabled for DATABASE_URL and all actual app secrets.
  SECRETS_SCAN_OMIT_KEYS = "CEC_STORAGE,CEC_EMAIL_MODE"

[[plugins]]
  package = "@netlify/plugin-nextjs"
