# Netlify hosts the MARKETING frontend only.
#
# The club app cannot run here: the backend keeps its record in a single SQLite
# file and Netlify gives every function invocation a fresh, empty filesystem,
# so web/lib/cec/db.ts refuses to open and /api/cec/* returns a 503 explaining
# why. That is deliberate — see DEPLOY.md. Do not "fix" it with
# CEC_ALLOW_EPHEMERAL=1, which only makes the data loss silent.

[build]
  # Every other path in this block is relative to `base`, so `publish` is
  # ".next" and NOT "web/.next" — the latter resolved to web/web/.next and
  # failed the build with "publish directory not found".
  base = "web"
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

[[plugins]]
  package = "@netlify/plugin-nextjs"
